services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: bookanook
      POSTGRES_PASSWORD: bookanook
      POSTGRES_DB: bookanook
    ports:
      - "127.0.0.1:6666:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
