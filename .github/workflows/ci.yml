name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make race
      - run: make vuln
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: bookanook
          POSTGRES_PASSWORD: bookanook
          POSTGRES_DB: bookanook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookanook -d bookanook_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://bookanook:bookanook@127.0.0.1:5432/bookanook_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make integration
      - run: go build ./...
